<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 50th Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,700&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --midnight:#12132B;
    --plum:#241a35;
    --gold:#D4AF6A;
    --glow:#F2D9A5;
    --cream:#F5EDE0;
    --ember:#C86B5B;
    --muted:#8C87A6;
    --line: rgba(245,237,224,0.14);

    --display: 'Fraunces', serif;
    --body: 'Sora', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 20% -10%, #2c2148 0%, transparent 55%),
      radial-gradient(ellipse at 85% 110%, #2a1e3b 0%, transparent 55%),
      var(--midnight);
    color:var(--cream);
    font-family:var(--body);
    overflow-x:hidden;
  }

  #confetti-canvas{
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:5;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 6vh 6vw 8vh;
    text-align:center;
    z-index:2;
  }

  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:0.85;
    margin-bottom: 28px;
  }

  /* ---------- Candles (signature interaction) ---------- */
  .candles{
    display:flex;
    gap:22px;
    margin-bottom: 10px;
    height: 92px;
    align-items:flex-end;
  }
  .candle{
    position:relative;
    width:14px;
    height:64px;
    background: linear-gradient(180deg, #efe3cf, var(--cream));
    border-radius: 3px;
    cursor:pointer;
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.15);
    transition: transform .2s ease;
  }
  .candle:hover{ transform: translateY(-2px); }
  .candle::before{ /* wick */
    content:'';
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:2px; height:8px; background:#3a2f22; border-radius:1px;
  }
  .flame{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom: 100%;
    width: 14px; height: 22px;
    margin-bottom: -2px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff4d0 0%, var(--glow) 35%, var(--ember) 78%, transparent 80%);
    filter: drop-shadow(0 0 10px rgba(242,217,165,0.85));
    animation: flicker 1.6s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  .candle.out .flame{ opacity:0; }
  .candle.out{ box-shadow:none; }
  .smoke{
    position:absolute; left:50%; bottom:100%;
    width:3px; height:3px; margin-bottom:6px;
    background: rgba(200,200,210,0.5);
    border-radius:50%;
    opacity:0;
    pointer-events:none;
  }
  .candle.out .smoke{ animation: smoke-rise 1.4s ease-out forwards; }

  @keyframes flicker{
    0%,100%{ transform: translateX(-50%) rotate(-2deg) scale(1); }
    50%{ transform: translateX(-50%) rotate(2deg) scale(1.06); }
  }
  @keyframes smoke-rise{
    0%{ opacity:0.6; transform: translate(-50%,0) scale(1); }
    100%{ opacity:0; transform: translate(-70%,-60px) scale(4); }
  }

  .pop-word{
    position:absolute;
    left:50%;
    bottom: 100%;
    transform: translateX(-50%) translateY(0) scale(0.8);
    margin-bottom: 6px;
    font-family: var(--display);
    font-style: italic;
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    color: var(--glow);
    text-shadow: 0 0 12px rgba(242,217,165,0.6);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    animation: pop-float 1.8s ease-out forwards;
  }
  @keyframes pop-float{
    0%{ opacity:0; transform: translateX(-50%) translateY(0) scale(0.6); }
    15%{ opacity:1; transform: translateX(-50%) translateY(-10px) scale(1.08); }
    30%{ transform: translateX(-50%) translateY(-16px) scale(1); }
    100%{ opacity:0; transform: translateX(-50%) translateY(-90px) scale(1); }
  }

  .candle-hint{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--muted);
    margin-bottom: 46px;
    min-height: 16px;
    transition: opacity .4s ease;
  }

  /* ---------- The number ---------- */
  .numeral-wrap{ position:relative; line-height:0.8; }
  .numeral{
    font-family:var(--display);
    font-weight:600;
    font-size: clamp(120px, 26vw, 300px);
    color: transparent;
    -webkit-text-stroke: 1.5px var(--gold);
    background: linear-gradient(180deg, var(--glow) 0%, var(--gold) 55%, var(--ember) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    letter-spacing: -0.02em;
  }

  .headline{
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(28px, 4.4vw, 52px);
    margin: 18px 0 6px;
    color: var(--cream);
  }
  .headline .name{
    font-style: normal;
    font-weight: 600;
    color: var(--gold);
  }

  .subline{
    font-family:var(--body);
    font-weight:300;
    font-size: clamp(14px, 1.6vw, 17px);
    color: var(--muted);
    max-width: 46ch;
    margin: 0 auto 56px;
    line-height:1.6;
  }

  /* ---------- Cute dragon pop-out ---------- */
  .dragon-zone{
    position:relative;
    width: min(720px, 88vw);
    margin-top: 8px;
    padding-top: 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height: 210px;
  }
 
  .bubble{
    position:relative;
    max-width: 320px;
    background: var(--cream);
    color: var(--midnight);
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: 15px;
    line-height:1.4;
    padding: 14px 18px;
    border-radius: 18px;
    margin-bottom: 10px;
    opacity:0;
    transform: translateY(8px) scale(0.92);
    transition: opacity .35s ease, transform .35s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .bubble.show{ opacity:1; transform: translateY(0) scale(1); }
  .bubble::after{
    content:'';
    position:absolute;
    bottom:-9px; left:50%;
    transform: translateX(-50%);
    width:0; height:0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 10px solid var(--cream);
  }
 
  .dragon{
    cursor:pointer;
    width: 128px;
    height: auto;
    transform: translateY(70px) scale(0.6);
    opacity: 0;
    transition: transform .7s cubic-bezier(.34,1.56,.64,1), opacity .5s ease;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.35));
  }
  .dragon.show{ transform: translateY(0) scale(1); opacity:1; }
  .dragon:active{ transform: translateY(0) scale(0.94); }
  .dragon-hint{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-top: 10px;
  }
 
  .reveal{
    opacity:0;
    transform: translateY(10px);
    transition: opacity .8s ease, transform .8s ease;
  }
  .reveal.show{ opacity:1; transform:none; }
 
  footer{
    position:relative;
    z-index:2;
    text-align:center;
    font-family:var(--mono);
    font-size:11px;
    color: var(--muted);
    letter-spacing:0.06em;
    padding: 0 6vw 40px;
  }
 
  @media (prefers-reduced-motion: reduce){
    .flame{ animation:none; }
    .candle{ transition:none; }
    .reveal{ transition:none; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<main class="stage">
  <div class="eyebrow">Half a century — and counting</div>

  <div class="candles" id="candles" aria-label="Click each candle to blow it out">
    <!-- 5 candles = 5 decades, blown out one by one -->
  </div>
  <div class="candle-hint" id="candleHint">tap a candle to blow it out</div>

  <div class="numeral-wrap">
    <div class="numeral">50</div>
  </div>

  <h1 class="headline">Happy 50th, <span class="name" id="nameSlot">You</span></h1>
  <p class="subline">Five decades of stories. Enjoy your special day.</p>

  <div class="dragon-zone">
    <div class="bubble" id="bubble">Psst... happy 50th!</div>
    <svg class="dragon" id="dragon" viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg" aria-label="A cute dragon" role="img">
      <ellipse cx="70" cy="145" rx="16" ry="6" fill="rgba(0,0,0,0.25)"/>
      <path d="M28 95 C10 90 6 105 16 112 C24 117 34 112 34 104 Z" fill="#C86B5B"/>
      <path d="M112 95 C130 90 134 105 124 112 C116 117 106 112 106 104 Z" fill="#C86B5B"/>
      <ellipse cx="70" cy="100" rx="38" ry="34" fill="url(#bodyGrad)"/>
      <path d="M40 132 Q30 150 44 152 Q40 140 50 134 Z" fill="#D4AF6A"/>
      <ellipse cx="70" cy="112" rx="20" ry="15" fill="#F5EDE0" opacity="0.9"/>
      <circle cx="70" cy="52" r="27" fill="url(#bodyGrad)"/>
      <path d="M54 32 L58 18 L64 33 Z" fill="#C86B5B"/>
      <path d="M86 32 L82 18 L76 33 Z" fill="#C86B5B"/>
      <circle cx="58" cy="52" r="7" fill="#F5EDE0"/>
      <circle cx="82" cy="52" r="7" fill="#F5EDE0"/>
      <circle cx="59" cy="53" r="3.4" fill="#241a35"/>
      <circle cx="83" cy="53" r="3.4" fill="#241a35"/>
      <circle cx="60.5" cy="51.5" r="1" fill="#fff"/>
      <circle cx="84.5" cy="51.5" r="1" fill="#fff"/>
      <circle cx="46" cy="60" r="5" fill="#C86B5B" opacity="0.55"/>
      <circle cx="94" cy="60" r="5" fill="#C86B5B" opacity="0.55"/>
      <path d="M62 66 Q70 72 78 66" stroke="#241a35" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <circle cx="65" cy="60" r="1.4" fill="#241a35"/>
      <circle cx="75" cy="60" r="1.4" fill="#241a35"/>
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F2D9A5"/>
          <stop offset="55%" stop-color="#D4AF6A"/>
          <stop offset="100%" stop-color="#C8934F"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="dragon-hint">tap the dragon</div>
  </div>
</main>

<footer>made with care, for my lovely mom &nbsp;·&nbsp; from Jamie</footer>

<script>
(function(){
  // ---- Personalize via ?name= in the URL,  ----
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  if(name){ document.getElementById('nameSlot').textContent = name; }

  // ---- Cute dragon: pops out on load, speaks on tap ----
  const dragonEl = document.getElementById('dragon');
  const bubbleEl = document.getElementById('bubble');
  const dragonHint = document.querySelector('.dragon-hint');
 
  const dragonLines = [
    "Psst... happy 50th!",
    "Happy 50th birthday to the queen",
    "生日快乐",
    "Wishing you long life, and good health",
    "I've been guarding this cake all day.",
    "年华五十，身体健康",
    "平安喜乐"
  ];
  let lineIndex = 0;
 
  function showBubble(text){
    bubbleEl.textContent = text;
    bubbleEl.classList.remove('show');
    // restart the transition
    void bubbleEl.offsetWidth;
    bubbleEl.classList.add('show');
  }
 
  // pop the dragon out shortly after load
  window.addEventListener('load', () => {
    setTimeout(() => {
      dragonEl.classList.add('show');
      showBubble(dragonLines[lineIndex]);
    }, 450);
  });
 
  dragonEl.addEventListener('click', () => {
    lineIndex = (lineIndex + 1) % dragonLines.length;
    showBubble(dragonLines[lineIndex]);
    dragonEl.style.transform = 'translateY(0) scale(1.08) rotate(-3deg)';
    setTimeout(() => { dragonEl.style.transform = ''; }, 220);
    if(dragonHint) dragonHint.style.opacity = '0';
  });

  // ---- Candles ----
  const candlesEl = document.getElementById('candles');
  const hintEl = document.getElementById('candleHint');
  const TOTAL = 5;
  let blownOut = 0;

  // one message per candle — edit these to whatever you'd like each one to say
  const messages = ['Happy', 'Birthday', 'Sweet 50th', 'Stay Healthy', 'Make A Wish'];

  for(let i=0;i<TOTAL;i++){
    const c = document.createElement('div');
    c.className = 'candle';
    c.dataset.msg = messages[i] || '🎉';
    c.innerHTML = '<div class="flame"></div><div class="smoke"></div>';
    c.addEventListener('click', onBlow, { once:true });
    candlesEl.appendChild(c);
  }

  function onBlow(e){
    const c = e.currentTarget;
    c.classList.add('out');

    // pop the word above the candle
    const word = document.createElement('div');
    word.className = 'pop-word';
    word.textContent = c.dataset.msg;
    c.appendChild(word);
    word.addEventListener('animationend', () => word.remove());

    blownOut++;
    if(blownOut < TOTAL){
      hintEl.textContent = (TOTAL - blownOut) + ' more to go';
    } else {
      hintEl.textContent = 'make a wish ✨';
      burstConfetti();
    }
  }

  // ---- Confetti (fires when the last candle goes out) ----
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#D4AF6A', '#F2D9A5', '#C86B5B', '#F5EDE0'];
  let particles = [];

  function burstConfetti(){
    particles = [];
    const count = 140;
    for(let i=0;i<count;i++){
      particles.push({
        x: canvas.width/2 + (Math.random()-0.5)*120,
        y: canvas.height*0.42,
        vx: (Math.random()-0.5) * 9,
        vy: -Math.random()*10 - 4,
        size: Math.random()*7 + 4,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.3,
        shape: Math.random() > 0.5 ? 'rect' : 'circle',
        life: 0
      });
    }
    if(!animating){ animating = true; requestAnimationFrame(tick); }
  }

  let animating = false;
  const gravity = 0.32;

  function tick(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    let alive = false;
    for(const p of particles){
      p.life++;
      p.vy += gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vx *= 0.995;
      if(p.y < canvas.height + 30){ alive = true; }
      const fade = Math.max(0, 1 - p.life/220);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = fade;
      ctx.fillStyle = p.color;
      if(p.shape === 'rect'){
        ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.size/2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    if(alive){
      requestAnimationFrame(tick);
    } else {
      animating = false;
      ctx.clearRect(0,0,canvas.width, canvas.height);
    }
  }
})();
</script>

</body>
</html>
